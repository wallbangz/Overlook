name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default: only the release job, on v* tags, gets a token that can write.
permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag each one was resolved from is in its comment);
# Dependabot (.github/dependabot.yml) proposes updates.
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: cmd
        run: build.cmd

      # A GUI-subsystem exe: Start-Process -Wait is what makes PowerShell wait for it and see its exit code.
      # The update test's live check is only reported, so a runner without network access still passes.
      - name: Self-tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force selftest | Out-Null
          foreach ($t in '--ini-test', '--update-test', '--weather-test') {
            $p = Start-Process bin\Overlook.exe -ArgumentList "$t `"$PWD\selftest`"" -Wait -PassThru
            "$t exit $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$t failed ($($p.ExitCode))" }
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: selftest
          path: selftest

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin\Overlook.exe, bin\OFL.txt, LICENSE, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath Overlook.zip -Force

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: Overlook
          path: Overlook.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the zip to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: Overlook

      # The tag reaches the script through the environment, never pasted into its text.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: .github/scripts/changelog-section.ps1 -Version $env:TAG -Out release-notes.md

      - name: Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3   # v3.0.4
        with:
          files: Overlook.zip
          body_path: release-notes.md
          generate_release_notes: true
          # vX.Y.Z-beta.N tags are pre-releases: never "Latest", so the stable update check skips them
          prerelease: ${{ contains(github.ref_name, '-') }}

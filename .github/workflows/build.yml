name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach the zip to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin\Overlook.exe, bin\OFL.txt, LICENSE, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath Overlook.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Overlook
          path: Overlook.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Overlook.zip
          generate_release_notes: true

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach the zip to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: build.cmd

      # A GUI-subsystem exe: Start-Process -Wait is what makes PowerShell wait for it and see its exit code.
      # The update test's live check is only reported, so a runner without network access still passes.
      - name: Self-tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force selftest | Out-Null
          foreach ($t in '--ini-test', '--update-test', '--weather-test') {
            $p = Start-Process bin\Overlook.exe -ArgumentList "$t `"$PWD\selftest`"" -Wait -PassThru
            "$t exit $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$t failed ($($p.ExitCode))" }
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: selftest
          path: selftest

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin\Overlook.exe, bin\OFL.txt, LICENSE, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath Overlook.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: Overlook
          path: Overlook.zip

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: .github/scripts/changelog-section.ps1 -Version '${{ github.ref_name }}' -Out release-notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Overlook.zip
          body_path: release-notes.md
          generate_release_notes: true
          # vX.Y.Z-beta.N tags are pre-releases: never "Latest", so the stable update check skips them
          prerelease: ${{ contains(github.ref_name, '-') }}

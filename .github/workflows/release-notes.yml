name: Release notes

# When CHANGELOG.md changes on main, each published release gets its section of it as its notes,
# so a correction to the changelog reaches the releases page too. A release with no section is left alone.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false   # gh uses GH_TOKEN below, not git's stored credentials

      - name: Update release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = gh release list --limit 100 --json tagName --jq '.[].tagName'
          foreach ($tag in $tags) {
            .github/scripts/changelog-section.ps1 -Version $tag -Out notes.md 2>$null
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path notes.md)) { "No CHANGELOG section for $tag"; continue }
            $prev = gh release view $tag --json body --jq '.body'
            # Keep GitHub's "Full Changelog" link at the end.
            $link = ($prev -split "`n" | Where-Object { $_ -match '^\*\*Full Changelog\*\*' }) -join "`n"
            if ($link) { Add-Content notes.md "`n$link" }
            gh release edit $tag --notes-file notes.md
            "Updated $tag"
            Remove-Item notes.md
          }

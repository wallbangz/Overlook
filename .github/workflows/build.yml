name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach the zip to a release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item bin\Overlook.exe, bin\OFL.txt, LICENSE, README.md dist\
          Compress-Archive -Path dist\* -DestinationPath Overlook.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: Overlook
          path: Overlook.zip

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: .github/scripts/changelog-section.ps1 -Version '${{ github.ref_name }}' -Out release-notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Overlook.zip
          body_path: release-notes.md
          generate_release_notes: true
